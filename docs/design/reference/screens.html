  URL parameters: s = screen id, w / h = size in dp, ts = text scale, full = 1 (no height limit).
  Without parameters the page shows an index of every screen.
-->
<style>
@font-face{font-family:"NotoKufiArabic";src:url("../assets/fonts/NotoKufiArabic[wght].ttf");font-weight:100 900}
@font-face{font-family:"IBMPlexSansArabic";src:url("../assets/fonts/IBMPlexSansArabic-Regular.ttf");font-weight:400}
@font-face{font-family:"IBMPlexSansArabic";src:url("../assets/fonts/IBMPlexSansArabic-Medium.ttf");font-weight:500}
@font-face{font-family:"IBMPlexSansArabic";src:url("../assets/fonts/IBMPlexSansArabic-SemiBold.ttf");font-weight:600}
@font-face{font-family:"IBMPlexSansArabic";src:url("../assets/fonts/IBMPlexSansArabic-Bold.ttf");font-weight:700}
:root{--pub-bg:#F3EBDD;--role-civ:#24508F;--role-imp:#C92D22}
.public{--bg:#F3EBDD;--surface:#FFFDF7;--sunken:#EADFCB;--text:#1B2A4A;--text2:#4F5A73;--text-disabled:#8A8FA0;--border:#1B2A4A;--border-strong:#1B2A4A;--primary:#C92D22;--primary-pressed:#A9241B;--on-primary:#FFFDF7;--accent:#E9A820;--on-accent:#1B2A4A;--error-text:#B3261C;--focus:#24508F;--shadow:#1B2A4A;--ticket:#FFFDF7;--on-ticket:#1B2A4A;--btn-shadow:4px 4px 0 #1B2A4A;--btn-press:translate(4px,4px);--ticket-shadow:6px 6px 0 #1B2A4A}
.private{--bg:#141C30;--surface:#1E2942;--sunken:#1E2942;--text:#F3EBDD;--text2:#B4BACB;--text-disabled:#6B7798;--border:#6B7798;--border-strong:#F3EBDD;--primary:#E9A820;--primary-pressed:#CF9212;--on-primary:#141C30;--accent:#E9A820;--on-accent:#141C30;--error-text:#FF8A7A;--focus:#F3EBDD;--shadow:#0A0F1C;--ticket:#F3EBDD;--on-ticket:#1B2A4A;--btn-shadow:none;--btn-press:translateY(2px);--ticket-shadow:0 6px 0 #0A0F1C}
.public{--ok:#1F6B4E;--scrim:rgba(20,28,48,0.6)}
.private{--ok:#7FD1A8;--scrim:rgba(10,15,28,0.7)}

*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;background:#E7E2D8;font-family:"IBMPlexSansArabic",system-ui,sans-serif}
/* ---------- themed stage ---------- */
.stage{padding:20px;border-radius:12px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;direction:rtl;background:var(--bg);color:var(--text);font-family:"IBMPlexSansArabic"}
.stage.col{flex-direction:column;align-items:stretch}
.w{width:312px}
.ic{width:24px;height:24px;display:inline-flex;flex:none}.ic svg{width:100%;height:100%;stroke-width:2.25}
.ic.s svg{stroke-width:2.4}.ic.s{width:20px;height:20px}
/* buttons */
.btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:60px;padding:0 20px;border-radius:16px;border:2.5px solid var(--border);background:transparent;color:var(--text);font-family:"NotoKufiArabic";font-weight:800;font-size:20px;line-height:1.3;cursor:pointer}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--btn-shadow)}
.btn.primary.pressed,.btn.primary:active{background:var(--primary-pressed);box-shadow:none;transform:var(--btn-press)}
.btn.secondary{height:52px;font-family:"IBMPlexSansArabic";font-weight:600;font-size:16px;border-color:var(--border-strong)}
.btn.secondary.pressed{background:var(--sunken)}
.btn.text{height:44px;border-color:transparent;font-family:"IBMPlexSansArabic";font-weight:600;font-size:16px;text-decoration:underline;text-underline-offset:5px}
.btn.accent{background:var(--accent);color:var(--on-accent);box-shadow:var(--btn-shadow)}
.btn.danger{height:52px;font-family:"IBMPlexSansArabic";font-weight:600;font-size:16px;color:var(--error-text);border-color:var(--error-text)}
.btn.disabled,.btn:disabled{background:var(--sunken);color:var(--text-disabled);border-color:var(--text-disabled);box-shadow:none;cursor:default;transform:none}
.btn.focus,.btn:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.iconbtn{appearance:none;width:48px;height:48px;border-radius:14px;border:2.5px solid var(--border-strong);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn.ghost{border-color:transparent;background:transparent}
/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:16px}
.input{height:56px;border-radius:16px;border:2.5px solid var(--border-strong);background:var(--surface);color:var(--text);padding:0 16px;font:400 18px/1.6 "IBMPlexSansArabic";width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.input.ph{color:var(--text2)}
.input.focused{outline:3px solid var(--focus);outline-offset:2px}
.input.err{border-color:var(--error-text)}
.help{font-size:13px;font-weight:500;color:var(--text2);display:flex;justify-content:space-between;gap:8px}
.help.err{color:var(--error-text);justify-content:flex-start;align-items:center;gap:6px}
.caret{width:2px;height:26px;background:var(--focus)}
/* cards */
.card{background:var(--surface);border:2.5px solid var(--border-strong);border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:12px;min-height:64px}
.badge{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);border:2.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font:900 18px/1 "NotoKufiArabic";flex:none;direction:ltr}
.name{flex:1;min-width:0;font-weight:700;font-size:20px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.dashed{border-style:dashed;justify-content:center;font-weight:600;color:var(--text);background:transparent}
.pack{align-items:center;padding:14px 16px;min-height:84px;position:relative}
.pack .t{font:800 20px/1.4 "NotoKufiArabic"}.pack .m{font-size:13px;font-weight:500;color:var(--text2)}
.pack.sel{box-shadow:3px 3px 0 var(--shadow);border-color:var(--border-strong)}
.pack.off{background:var(--sunken)}.pack.off .t{color:var(--text2)}
.stamp{border:2.5px solid var(--error-text);color:var(--error-text);border-radius:8px;padding:2px 10px;font-weight:700;font-size:13px;transform:rotate(-6deg);display:inline-flex;align-items:center;gap:4px;flex:none}
.stamp.ink{border-color:var(--border-strong);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--border-strong);border-radius:999px;padding:4px 14px;font-weight:600;font-size:16px;line-height:1.3}
.pill{display:inline-flex;border:2.5px solid var(--border-strong);border-radius:999px;padding:4px 14px;font:700 16px/1.3 "IBMPlexSansArabic";direction:ltr}
/* controls */
.check{width:28px;height:28px;border-radius:8px;border:2.5px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.check.on{background:var(--primary);color:var(--on-primary)}
.radio{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--border-strong);background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.radio.on::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--primary)}
.switch{width:56px;height:32px;border-radius:999px;border:2.5px solid var(--border-strong);background:var(--sunken);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;right:2px;width:23px;height:23px;border-radius:50%;background:var(--text)}
.switch.on{background:var(--primary)}.switch.on::after{right:auto;left:2px;background:var(--on-primary)}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;font-weight:600;font-size:16px}
/* feedback */
.banner{border:2.5px solid var(--border-strong);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.6;background:var(--surface)}
.banner.warn{background:var(--accent);color:var(--on-accent)}
.banner.err{border-color:var(--error-text);color:var(--error-text)}
.dialog{background:var(--surface);border:2.5px solid var(--border-strong);border-radius:20px;padding:24px;box-shadow:6px 6px 0 var(--shadow);display:flex;flex-direction:column;gap:12px}
.dialog h3,.h-title{margin:0;font:800 26px/1.4 "NotoKufiArabic"}
.dialog p{margin:0;font-size:16px;line-height:1.6}
.sheet{background:var(--surface);border:2.5px solid var(--border-strong);border-bottom:0;border-radius:28px 28px 0 0;padding:12px 24px 24px;display:flex;flex-direction:column;gap:12px}
.grab{width:44px;height:5px;border-radius:999px;background:var(--text2);align-self:center}
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 16px}
.state .big{width:72px;height:72px;border-radius:50%;border:3.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center}
.state .big .ic{width:32px;height:32px}
.dots{display:flex;gap:8px;direction:ltr}.dots i{width:12px;height:12px;border-radius:50%;background:var(--text);animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.appbar{height:56px;display:flex;align-items:center;gap:8px}
.appbar .h-title{flex:1;font-size:22px}
/* ticket */
.ticket{background:var(--ticket);color:var(--on-ticket);border-radius:20px;position:relative;display:flex;flex-direction:column;box-shadow:var(--ticket-shadow)}
.ticket .top{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ticket .lbl{font-size:13px;font-weight:500}
.ticket .role{font:800 26px/1.4 "NotoKufiArabic"}
.ticket .rs{width:52px;height:52px;border:3.5px solid currentColor;border-radius:12px;display:flex;align-items:center;justify-content:center;transform:rotate(6deg);flex:none}
.perf{border-top:2.5px dashed currentColor;margin:0 14px;position:relative;height:0}
.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.perf::before{right:-26px}.perf::after{left:-26px}
.ticket .bot{padding:18px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:206px;justify-content:center;text-align:center}
.word{font:900 64px/1.3 "NotoKufiArabic";max-width:100%;overflow-wrap:anywhere}
.word.m{font-size:48px}.word.sm{font-size:40px}
.ticket .chip{border-color:currentColor;font-size:15px}
.seal{font:800 20px/1.4 "NotoKufiArabic";display:flex;flex-direction:column;align-items:center;gap:10px}
.hint{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--primary)}
/* voting + results */
.vote{min-height:64px;border:2.5px solid var(--border);border-radius:16px;padding:8px 14px;display:flex;align-items:center;gap:12px;background:var(--surface)}
.vote.sel{border-color:var(--primary);background:transparent;outline:2.5px solid var(--primary);outline-offset:-6px}
.vote.dis{opacity:1;color:var(--text-disabled);border-style:dashed}
.tally{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:2.5px dashed var(--border-strong);padding:6px 0}
.tally .marks{display:flex;gap:4px;direction:rtl}.tally .marks i{width:18px;height:18px;border-radius:5px;border:2.5px solid var(--error-text);transform:rotate(-8deg)}
.num{font:900 34px/1.2 "NotoKufiArabic";direction:ltr;min-width:36px;text-align:center}
.rolestamp{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;font-weight:700;font-size:15px;color:#FFFDF7;flex:none}
.rolestamp.civ{background:var(--role-civ);border-radius:8px}.rolestamp.imp{background:var(--role-imp);border-radius:999px}
.winner{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0}
.bigstamp{border:5px solid var(--error-text);color:var(--error-text);border-radius:18px;padding:6px 22px;font:900 34px/1.35 "NotoKufiArabic";transform:rotate(-5deg)}
.bigstamp.civ{border-color:var(--role-civ);color:var(--role-civ)}.bigstamp.draw{border-color:var(--text);color:var(--text);border-style:dashed}
.plaque{background:var(--surface);border:2.5px solid var(--border-strong);border-radius:20px;padding:14px 20px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:4px 4px 0 var(--shadow)}
/* phone */
.phone{width:360px;height:720px;border-radius:28px;border:8px solid #0A0F1C;overflow:hidden;position:relative;background:var(--pub-bg);flex:none}
.screen{position:absolute;inset:0;padding:24px 24px 24px;display:flex;flex-direction:column;gap:16px;direction:rtl;background:var(--bg);color:var(--text)}
.screen .grow{flex:1}
.carbon-sheet{position:absolute;inset:0;transform:translateY(100%);transition:transform 520ms cubic-bezier(.2,0,0,1)}
.carbon-sheet.up{transform:none}
@media (prefers-reduced-motion:reduce){.carbon-sheet{transition:opacity 140ms linear;transform:none;opacity:0;pointer-events:none}.carbon-sheet.up{opacity:1;pointer-events:auto}.dots i{animation:none}}
.fade{animation:fade .14s linear both}@keyframes fade{from{opacity:0}to{opacity:1}}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.dl{font:900 48px/1.3 "NotoKufiArabic";max-width:100%;overflow-wrap:anywhere}.dl.m{font-size:36px}.dl.sm{font-size:32px}
.note{font-size:13px;background:#FFF4D6;border-radius:8px;padding:8px 12px;color:#4a3a00}


/* ---------- screen layout (spacing.json → layout) ---------- */
.device{position:relative;overflow:hidden;display:flex;flex-direction:column;direction:rtl;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6}
.sb{height:24px;flex:none;background:rgba(0,0,0,.10)}
.nb{height:48px;flex:none;background:rgba(0,0,0,.10)}
.kb{flex:none;background:#C9CDD6;color:#3b4252;display:flex;align-items:center;justify-content:center;font:500 12px/1.3 system-ui,sans-serif;direction:ltr;border-top:1px solid rgba(0,0,0,.2)}
.body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:24px;padding:16px var(--m) 0}
.body.tight{gap:12px}
.body.vcenter{justify-content:center}
.actions{flex:none;display:flex;flex-direction:column;gap:12px;padding:12px var(--m) 24px}
.col{display:flex;flex-direction:column;gap:12px}
.maxw{width:100%;max-width:480px;margin-inline:auto}
.grow{flex:1}
.t-displayM{font:800 34px/1.35 "NotoKufiArabic"}
.t-titleL{font:800 26px/1.4 "NotoKufiArabic"}
.t-titleM{font:700 20px/1.45 "IBMPlexSansArabic"}
.t-bodyL{font:400 18px/1.6 "IBMPlexSansArabic"}
.t-bodyM{font:400 16px/1.6 "IBMPlexSansArabic"}
.t-labelM{font:600 16px/1.3 "IBMPlexSansArabic"}
.t-caption{font:500 13px/1.5 "IBMPlexSansArabic"}
.c2{color:var(--text2)}
.tc{text-align:center}
.ltr{direction:ltr;unicode-bidi:isolate}
.iso{unicode-bidi:isolate}
.one{white-space:nowrap}
.rowsb{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero{width:100%;max-width:320px;align-self:center;height:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.overlay.mid{justify-content:center;padding:0 var(--m)}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.overlay>*{position:relative}
.body>*{flex:none}
.body>.grow{flex:1}
/* A sheet never grows past the space above the keyboard; its content scrolls (clipped here). */
.overlay .sheet{max-height:100%;overflow:hidden}
.overlay .sheet>*{flex:none}
.private .dialog{box-shadow:none}
.word{font-size:72px}
.wordbox{width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wordbox .word{line-height:1.15}
.btn{flex:none}
.btn .lbl1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pair{display:flex;gap:12px}.pair .btn{flex:1}
.tut{align-items:flex-start;padding:16px;gap:12px}
.rule{display:flex;gap:8px;align-items:flex-start}
.okline{display:flex;gap:6px;align-items:center;font-weight:600}
/* index page */
.index{direction:ltr;padding:24px;font:14px/1.6 system-ui,sans-serif;color:#1B2A4A;overflow:auto;height:100vh}
.index a{color:#24508F}
#metrics{display:none}
</style>
</head>

function ticket(mode,variant){

  else { topLbl=open?T.roleLabel:T.roleSealed; topMain=open?(imp?T.imp:T.civ):name; botLbl=open?(imp?T.catOnly:T.wordLabel):''; }
  const top='<div class="top"><div style="min-width:0"><div class="lbl" data-m="toplbl">'+topLbl+'</div><div class="role one iso" data-m="toprole" style="overflow:hidden;text-overflow:ellipsis">'+topMain+'</div></div><span class="rs">'+ic(open?'user':'lock')+'</span></div><div class="perf"></div>';
  const w=imp?CAT:(variant==='long'||variant==='Blong'?LONGWORD:WORD);

    ? '<div class="wordbox" data-box="94"><div class="word'+(variant==='Blong'?'':' one')+'" '+(variant==='Blong'?'data-fitwrap="40"':'data-fit="40"')+' data-m="word">'+w+'</div></div>'
    : '<div class="word one" data-fit="40" data-m="word">'+w+'</div>';
  if(variant==='Blong'){variant='B';topLbl=T.roleSealed;topMain=name;botLbl=T.civ+' · '+T.wordLabel;}

                :'<div class="bot"><div class="seal">'+ic('eye_off')+'<span>'+T.sealed+'</span></div></div>';
  return '<div class="ticket" data-m="ticket">'+top+bot+'</div>';
}

/* ---------- render ---------- */
const root=document.getElementById('root');
if(!SID){
  root.className='index';
  root.innerHTML='<h1>Tesskra — screen compositions</h1><p>Design reference built from the tokens. Provisional Arabic, mock content. Open a screen at a size:</p><ul>'+Object.keys(SCREENS).map(k=>'<li>'+k+' — '+[[360,720,1],[320,568,1],[320,568,1.5]].map(v=>'<a href="?s='+k+'&w='+v[0]+'&h='+v[1]+'&ts='+v[2]+'">'+v[0]+'×'+v[1]+(v[2]>1?' @'+v[2]:'')+'</a>').join(' · ')+' · <a href="?s='+k+'&full=1">full length</a></li>').join('')+'</ul>';
}else{
  const s=SCREENS[SID]();
  const kbH=s.kb?KB:0;
  root.innerHTML='<div class="device '+s.theme+'" id="device" style="--m:'+M+'px;width:'+W+'px;'+(FULL?'min-height:'+H+'px':'height:'+H+'px')+'">'
    +'<div class="sb"></div><div class="body maxw '+(s.bodyClass||'')+'" id="body"'+(FULL?' style="overflow:visible;flex:none"':'')+'>'+s.body+'</div>'
    +(s.actions?'<div class="actions maxw" id="actions">'+s.actions+'</div>':'<div style="height:24px;flex:none"></div>')
    +(kbH?'<div class="kb" style="height:'+kbH+'px">keyboard (assumed '+kbH+' dp)</div>':'')+'<div class="nb"></div>'
    +(s.overlay?s.overlay.replace('class="overlay','style="bottom:'+(kbH+48)+'px;top:24px" class="overlay'):'')+'</div>';
  const dev=document.getElementById('device');
  const run=()=>{
    // text scale: multiply every computed font size (display styles are not clamped up to 1.5)
    if(TS!==1){const els=[...dev.querySelectorAll('*')].filter(e=>!e.closest('.kb'));const sizes=els.map(e=>parseFloat(getComputedStyle(e).fontSize));els.forEach((e,i)=>e.style.fontSize=(sizes[i]*TS)+'px');}
    // shrink-to-fit: one line down to an absolute floor (typography.json minFontSize)
    dev.querySelectorAll('[data-box]').forEach(e=>e.style.height=(parseFloat(e.dataset.box)*TS)+'px');
    const fits=[];
    dev.querySelectorAll('[data-fit]').forEach(e=>{const min=+e.dataset.fit;let f=parseFloat(getComputedStyle(e).fontSize);e.style.maxWidth='100%';e.style.overflow='hidden';while(e.scrollWidth>e.clientWidth&&f>min){f-=1;e.style.fontSize=f+'px';}fits.push({m:e.dataset.m||'',font:f,clipped:e.scrollWidth>e.clientWidth});});
    dev.querySelectorAll('[data-fitwrap]').forEach(e=>{const min=+e.dataset.fitwrap;let f=parseFloat(getComputedStyle(e).fontSize);e.style.whiteSpace='nowrap';e.style.maxWidth='100%';while(e.scrollWidth>e.clientWidth&&f>min){f-=1;e.style.fontSize=f+'px';}if(e.scrollWidth>e.clientWidth){e.style.whiteSpace='normal';e.style.textAlign='center';}fits.push({m:e.dataset.m||'',font:f,wrapped:getComputedStyle(e).whiteSpace==='normal'});});
    dev.querySelectorAll('[data-fit2]').forEach(e=>{const min=+e.dataset.fit2;let f=parseFloat(getComputedStyle(e).fontSize);e.style.whiteSpace='nowrap';e.style.maxWidth='100%';while(e.scrollWidth>e.clientWidth&&f>min){f-=1;e.style.fontSize=f+'px';}if(e.scrollWidth>e.clientWidth){e.style.whiteSpace='normal';}const lh=parseFloat(getComputedStyle(e).lineHeight);fits.push({m:e.dataset.m||'name',font:f,lines:Math.round(e.getBoundingClientRect().height/lh)});});
    // measurements
    const R=e=>{const r=e.getBoundingClientRect();return{x:Math.round(r.left),y:Math.round(r.top),w:Math.round(r.width),h:Math.round(r.height)}};
    const body=document.getElementById('body');
    const limit=dev.getBoundingClientRect().height-48-kbH;   // bottom of usable area
    const acts=[...dev.querySelectorAll('.btn')].map(b=>{const r=R(b);return{act:b.dataset.act,...r,visible:r.y>=24&&r.y+r.h<=limit+0.5&&(!b.closest('#body')||r.y+r.h<=body.getBoundingClientRect().bottom+0.5)}});
    const taps=[...dev.querySelectorAll('[data-tap]')].map(R).filter(r=>r.w<48||r.h<48);
    const hover=[...dev.querySelectorAll('.body *,.actions *,.sheet *,.dialog *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.left<-0.5||r.right>W+0.5)}).length;
    const trunc=[...dev.querySelectorAll('.name,.lbl1,.one')].filter(e=>e.scrollWidth>e.clientWidth+1).map(e=>e.textContent.slice(0,24));
    const named={};dev.querySelectorAll('[data-m]').forEach(e=>{const r=R(e);const range=document.createRange();range.selectNodeContents(e);named[e.dataset.m]={...r,textW:Math.round(range.getBoundingClientRect().width),font:Math.round(parseFloat(getComputedStyle(e).fontSize)*10)/10}});
    const fields=[...dev.querySelectorAll('[data-field]')].map(e=>{const r=R(e);return{...r,visible:r.y>=24&&r.y+r.h<=limit+0.5}});
    document.getElementById('metrics').textContent=JSON.stringify({id:SID,w:W,h:H,ts:TS,kb:kbH,margin:M,deviceH:Math.round(dev.getBoundingClientRect().height),bodyClient:body.clientHeight,bodyContent:body.scrollHeight,hidden:Math.max(0,body.scrollHeight-body.clientHeight),usableBottom:limit,acts,fields,smallTaps:taps,hOverflow:hover,truncated:trunc,fits,named});
  };
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(run,50));
}
