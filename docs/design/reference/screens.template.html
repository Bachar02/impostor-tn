<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Impostor TN — Tesskra screen compositions</title>
<!--
  Design reference only (not application code). Built by docs/design/tools/build_screens.py.
  Component styles are copied at build time from index.template.html, so this page cannot
  restyle a component. Only screen-level layout is defined here, using values from
  docs/design/tokens/spacing.json. All Arabic text is provisional (see ARABIC_LOCALIZATION.md
  and SCREEN_SPECIFICATIONS.md, Appendix A). Names, packs and words are mock content.

  URL parameters: s = screen id, w / h = size in dp, ts = text scale, full = 1 (no height limit).
  Without parameters the page shows an index of every screen.
-->
<style>
@font-face{font-family:"NotoKufiArabic";src:url("__FONTS__/NotoKufiArabic[wght].ttf");font-weight:100 900}
@font-face{font-family:"IBMPlexSansArabic";src:url("__FONTS__/IBMPlexSansArabic-Regular.ttf");font-weight:400}
@font-face{font-family:"IBMPlexSansArabic";src:url("__FONTS__/IBMPlexSansArabic-Medium.ttf");font-weight:500}
@font-face{font-family:"IBMPlexSansArabic";src:url("__FONTS__/IBMPlexSansArabic-SemiBold.ttf");font-weight:600}
@font-face{font-family:"IBMPlexSansArabic";src:url("__FONTS__/IBMPlexSansArabic-Bold.ttf");font-weight:700}
/*__TOKENS_CSS__*/
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;background:#E7E2D8;font-family:"IBMPlexSansArabic",system-ui,sans-serif}
/*__COMPONENT_CSS__*/

/* ---------- screen layout (spacing.json → layout) ---------- */
.device{position:relative;overflow:hidden;display:flex;flex-direction:column;direction:rtl;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6}
.sb{height:24px;flex:none;background:rgba(0,0,0,.10)}
.nb{height:48px;flex:none;background:rgba(0,0,0,.10)}
.kb{flex:none;background:#C9CDD6;color:#3b4252;display:flex;align-items:center;justify-content:center;font:500 12px/1.3 system-ui,sans-serif;direction:ltr;border-top:1px solid rgba(0,0,0,.2)}
.body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:24px;padding:16px var(--m) 0}
.body.tight{gap:12px}
.body.vcenter{justify-content:center}
.actions{flex:none;display:flex;flex-direction:column;gap:12px;padding:12px var(--m) 24px}
.col{display:flex;flex-direction:column;gap:12px}
.maxw{width:100%;max-width:480px;margin-inline:auto}
.grow{flex:1}
.t-displayM{font:800 34px/1.35 "NotoKufiArabic"}
.t-titleL{font:800 26px/1.4 "NotoKufiArabic"}
.t-titleM{font:700 20px/1.45 "IBMPlexSansArabic"}
.t-bodyL{font:400 18px/1.6 "IBMPlexSansArabic"}
.t-bodyM{font:400 16px/1.6 "IBMPlexSansArabic"}
.t-labelM{font:600 16px/1.3 "IBMPlexSansArabic"}
.t-caption{font:500 13px/1.5 "IBMPlexSansArabic"}
.c2{color:var(--text2)}
.tc{text-align:center}
.ltr{direction:ltr;unicode-bidi:isolate}
.iso{unicode-bidi:isolate}
.one{white-space:nowrap}
.rowsb{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero{width:100%;max-width:320px;align-self:center;height:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.overlay.mid{justify-content:center;padding:0 var(--m)}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.overlay>*{position:relative}
.body>*{flex:none}
.body>.grow{flex:1}
/* A sheet never grows past the space above the keyboard; its content scrolls (clipped here). */
.overlay .sheet{max-height:100%;overflow:hidden}
.overlay .sheet>*{flex:none}
.private .dialog{box-shadow:none}
.word{font-size:72px}
.wordbox{width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wordbox .word{line-height:1.15}
.btn{flex:none}
.btn .lbl1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pair{display:flex;gap:12px}.pair .btn{flex:1}
.tut{align-items:flex-start;padding:16px;gap:12px}
.rule{display:flex;gap:8px;align-items:flex-start}
.okline{display:flex;gap:6px;align-items:center;font-weight:600}
/* index page */
.index{direction:ltr;padding:24px;font:14px/1.6 system-ui,sans-serif;color:#1B2A4A;overflow:auto;height:100vh}
.index a{color:#24508F}
#metrics{display:none}
</style>
</head>
<body>
<div id="root"></div>
<pre id="metrics"></pre>
<script>
const IC=__ICONS_JSON__;
const q=new URLSearchParams(location.search);
const W=+(q.get('w')||360), H=+(q.get('h')||720), TS=+(q.get('ts')||1), FULL=q.get('full')==='1', SID=q.get('s');
const M=W<360?16:24;                       // layout.screenMarginH / screenMarginHCompact
const KB=H<=600?260:300;                   // assumed keyboard height (not a token)
const ic=(n,small)=>'<span class="ic'+(small?' s':'')+'">'+IC[n]+'</span>';
const iso=t=>'<span class="iso">'+t+'</span>';
const ltr=t=>'<span class="ltr">'+t+'</span>';

/* ---------- provisional strings (glossary + Appendix A drafts) ---------- */
const T={
 tagline:'شكون فيكم؟', facts:ltr('4–12')+' لعّابة · تليفون واحد · من غير أنترنات',
 newGame:'طرح جديد', howTo:'كيفاش تتلعب؟', players:'اللعّابة', addPlayer:'زيد لعّاب',
 nameLabel:'اسم اللعّاب', nameHint:'مثلا: سلمى', nameLimit:'حتى 16 حرف', dup:'الاسم هذا موجود',
 min4:'لازمكم 4 لعّابة على الأقل', empty:'مازال ما فمّا حتى لعّاب', emptyHint:'زيد 4 لعّابة باش تبداو',
 max12:ltr('12')+' لعّاب هو الحدّ', cont:'كمّل', add:'زيد', confirm:'أكّد', back:'ارجع', rename:'بدّل الاسم',
 del:'فسّخ اللعّاب', earlier:'قدّم', later:'أخّر', packsTitle:'اختار الباكوات', selected:'مختار',
 packEmpty:'ما فيه حتى كلمة', noPack:'اختار باكو واحد على الأقل', start:'هيّا نبداو', error:'صار مشكل. عاود مرّة أخرى.',
 retry:'عاود', restoreFailed:'الطرح اللي فات ما نجّمناش نرجّعوه', passLabel:'أعطي التليفون لـ', iAm:'أنا',
 onlyYou:'ما يشوف حد غيرك', sealed:'الدور مخبّي', show:'ورّيني دوري', roleLabel:'دورك', roleSealed:'دور',
 civ:'مدني', imp:'إمبوستور', wordLabel:'الكلمة السرّية', category:'الصنف:', catOnly:'الصنف برك',
 noWord:'ما تعرفش الكلمة', ack:'فهمت، خبّي', allDone:'الكل شافوا دورهم', clues:'التلميحات', vote:'التصويت',
 putPhone:'حطّوا التليفون في الوسط', rule1:'كل واحد يقول كلمة وحدة على الكلمة السرّية',
 rule2:'تنجّم تعدّي من غير ما تقول شي', rule3:'وقت تكمّلوا، ابداو التصويت', startVote:'نبداو التصويت',
 voteTitle:'شكون الإمبوستور؟', runoff:'التصويت الثاني', runoffHint:'اختار من بين المتعادلين', self:'إنتي',
 tallyTitle:'نتيجة التصويت', nominated:'أكثر أصوات:', caught:'الإمبوستور:',
 finalChance:'آخر فرصة للإمبوستور: محاولة وحدة على الكلمة السرّية', seeResult:'شوفوا النتيجة',
 runoffStart:'نعاودو التصويت', tie:'تعادل في الأصوات. نعاودو التصويت بيناتهم.', passTo:'أعطي التليفون لـ',
 guessTitle:'شنوّة الكلمة السرّية؟', oneChance:'محاولة وحدة برك', guessLabel:'جوابك',
 reviewTitle:'هذا جوابك النهائي؟', finalYes:'إيه، هذا جوابي', edit:'نبدّلو',
 civWin:'المدنيين ربحوا', impWin:'الإمبوستور ربح', draw:'تعادل', civOut:'خرّجتو مدني',
 drawNote:'حتى التصويت الثاني وفى بتعادل', guessOf:'جواب الإمبوستور', correct:'صحيح', wrong:'غالط',
 votes:'الأصوات', first:'التصويت الأوّل', again:'طرح آخر', change:'بدّل اللعّابة والباكوات', home:'الرئيسية',
 resumed:'الطرح توقّف. كمّلوا من وين وصلتوا.', leave:'أخرج', quitTitle:'تخرج من الطرح؟',
 quitBody:'الطرح الحالي يتفسّخ وما تنجّمش ترجّعو.', keep:'كمّل اللعب', gotIt:'فهمت', settings:'الإعدادات',
 haptics:'الاهتزاز', credits:'الخطوط والأيقونات', licenses:'التراخيص', version:'النسخة',
 tut:[['users','الهدف','الكل عندهم نفس الكلمة السرّية، كان واحد: الإمبوستور. لازم تلقاوه.'],
      ['user','المدني والإمبوستور','المدني يشوف الكلمة والصنف متاعها. الإمبوستور يشوف الصنف برك.'],
      ['smartphone','تليفون واحد يدور','كل لعّاب ياخذ التليفون، يشوف دورو وحدو، يخبّيه، ومبعد يعدّيه.'],
      ['message_circle','تلميح بكلمة وحدة','كل واحد يقول كلمة وحدة على الكلمة السرّية. تنجّم تعدّي من غير ما تقول شي.'],
      ['vote','التصويت','كل واحد يصوّت في السرّ على اللي يشكّ فيه، وما يصوّتش على روحو. كان فمّا تعادل، نعاودو مرّة وحدة بين المتعادلين. وكان تعاود التعادل، الطرح يوفى بتعادل.'],
      ['trophy','آخر فرصة','كان شدّيتو الإمبوستور، عندو محاولة وحدة باش يعرف الكلمة: كان جابها يربح، وكان غلط المدنيين يربحوا. وكان خرّجتو مدني، الإمبوستور يربح.']]
};
/* ---------- mock content (not UI strings) ---------- */
const LONG='عبد الرحمان بن عاشور الطرابلسي';
const P12=['سلمى','ياسين',LONG,'ڨمر','أمين','مريم','يوسف','آية','مهدي','نور الهدى','حمزة','Sami'];
const P6=P12.slice(0,6);
const NAME16='عبد الرحمان بنور';            // exactly 16 characters, the proposed limit (Q-01)
const WORD='بريك', CAT='ماكلة', LONGWORD='كسكسي بالعصبان', GUESS='بريكة';
const PACKS=[['ماكلة تونسية',60,'sel'],['بلايص',48,'sel'],['كورة',36,''],['أمثال',0,'off']];

/* ---------- pieces ---------- */
const btn=(cls,label,o={})=>'<button class="btn '+cls+'" data-tap data-act="'+(o.act||label.replace(/<[^>]*>/g,''))+'"'+(o.dis?' disabled':'')+'>'+(o.icon?ic(o.icon):'')+'<span class="lbl1">'+label+'</span></button>';
const dots='<span class="dots"><i></i><i></i><i></i></span>';
const loadingBtn=cls=>'<button class="btn '+cls+'" data-act="loading" disabled style="background:var(--primary);color:var(--on-primary);border-color:var(--border)">'+dots+'</button>';
const iconbtn=(n,ghost,label)=>'<button class="iconbtn'+(ghost?' ghost':'')+'" data-tap aria-label="'+label+'">'+ic(n)+'</button>';
const appbar=(title,o={})=>'<div class="appbar">'+(o.back?iconbtn('arrow_right',true,'back'):'')+'<span class="h-title one">'+title+'</span>'+(o.close?iconbtn('x',true,'close'):'')+(o.end||'')+'</div>';
const banner=(kind,icon,text)=>'<div class="banner '+kind+'">'+ic(icon)+'<span>'+text+'</span></div>';
const hint='<div class="hint">'+ic('eye_off')+'<span>'+T.onlyYou+'</span></div>';
const prow=(i,n)=>'<div class="card" data-tap><span class="badge">'+(i+1)+'</span><span class="name iso">'+n+'</span>'+iconbtn('pencil',true,'edit')+'</div>';
const addRow='<div class="card dashed" data-tap>'+ic('plus')+' '+T.addPlayer+'</div>';
const field=(label,value,o={})=>'<div class="field"><label>'+label+'</label><div class="input'+(o.ph?' ph':'')+(o.focus?' focused':'')+(o.err?' err':'')+'" data-field><span class="iso">'+value+'</span>'+(o.focus?'<span class="caret"></span>':'')+'</div>'+(o.err?'<div class="help err">'+ic('alert',1)+o.err+'</div>':o.help?'<div class="help"><span>'+o.help+'</span>'+(o.count?ltr(o.count):'')+'</div>':'')+'</div>';
const pack=([t,n,st])=>'<div class="card pack'+(st==='sel'?' sel':'')+(st==='off'?' off':'')+'"'+(st==='off'?'':' data-tap')+'><div style="flex:1;min-width:0"><div class="t">'+t+'</div><div class="m">'+(st==='off'?T.packEmpty:ltr(n)+' كلمة')+'</div></div>'+(st==='sel'?'<span class="stamp">'+ic('check',1)+' '+T.selected+'</span>':st==='off'?ic('alert'):'<span class="check"></span>')+'</div>';
function ticket(mode,variant){
  // mode: sealed | civ | imp. variant B = proposed parity layout (Q-25): the top row never changes.
  const open=mode!=='sealed', imp=mode==='imp', name=P6[1];
  let topLbl, topMain, botLbl;
  if(variant==='B'||variant==='Blong'){ topLbl=T.roleSealed; topMain=name; botLbl=open?(imp?T.imp+' · '+T.catOnly:T.civ+' · '+T.wordLabel):''; }
  else { topLbl=open?T.roleLabel:T.roleSealed; topMain=open?(imp?T.imp:T.civ):name; botLbl=open?(imp?T.catOnly:T.wordLabel):''; }
  const top='<div class="top"><div style="min-width:0"><div class="lbl" data-m="toplbl">'+topLbl+'</div><div class="role one iso" data-m="toprole" style="overflow:hidden;text-overflow:ellipsis">'+topMain+'</div></div><span class="rs">'+ic(open?'user':'lock')+'</span></div><div class="perf"></div>';
  const w=imp?CAT:(variant==='long'||variant==='Blong'?LONGWORD:WORD);
  const wordEl=(variant==='B'||variant==='Blong')
    ? '<div class="wordbox" data-box="94"><div class="word'+(variant==='Blong'?'':' one')+'" '+(variant==='Blong'?'data-fitwrap="40"':'data-fit="40"')+' data-m="word">'+w+'</div></div>'
    : '<div class="word one" data-fit="40" data-m="word">'+w+'</div>';
  if(variant==='Blong'){variant='B';topLbl=T.roleSealed;topMain=name;botLbl=T.civ+' · '+T.wordLabel;}
  const bot=open?'<div class="bot"><div class="lbl" data-m="botlbl">'+botLbl+'</div>'+wordEl+'<span class="chip" data-m="chip">'+(imp?T.noWord:T.category+' '+CAT)+'</span></div>'
                :'<div class="bot"><div class="seal">'+ic('eye_off')+'<span>'+T.sealed+'</span></div></div>';
  return '<div class="ticket" data-m="ticket">'+top+bot+'</div>';
}
const vopt=(n,st)=>'<div class="vote'+(st==='sel'?' sel':'')+(st==='dis'?' dis':'')+'"'+(st==='dis'?'':' data-tap')+'><span class="radio'+(st==='sel'?' on':'')+'"'+(st==='dis'?' style="border-color:var(--text-disabled)"':'')+'></span><span class="name iso">'+n+'</span>'+(st==='dis'?'<span class="t-caption">'+T.self+'</span>':'')+'</div>';
const tally=(n,c)=>'<div class="tally"><span class="name iso">'+n+'</span><span class="marks">'+'<i></i>'.repeat(c)+'</span><span class="num">'+c+'</span></div>';
const rrow=(i,n,imp)=>'<div class="card"><span class="badge">'+(i+1)+'</span><span class="name iso">'+n+'</span><span class="rolestamp '+(imp?'imp':'civ')+'">'+ic(imp?'eye_off':'user',1)+' '+(imp?T.imp:T.civ)+'</span></div>';
const chip=(icon,t)=>'<span class="chip" style="align-self:center">'+ic(icon,1)+' '+t+'</span>';
const sheet=inner=>({overlay:'<div class="overlay"><div class="scrim"></div><div class="sheet" data-m="sheet"><span class="grab"></span>'+inner+'</div></div>'});
const dialog=()=>'<div class="overlay mid"><div class="scrim"></div><div class="dialog" data-m="dialog"><h3>'+T.quitTitle+'</h3><p>'+T.quitBody+'</p>'+btn('danger',T.leave)+btn('secondary',T.keep)+'</div></div>';

/* ---------- screens: {theme, body, actions, overlay, kb, bodyClass} ---------- */
const playersScreen=(list,extra={})=>({theme:'public',
  body:appbar(T.newGame,{back:1})+'<div class="col"><div class="rowsb"><span class="t-titleL">'+T.players+'</span><span class="pill">'+list.length+' / 12</span></div>'
    +(list.length>0&&list.length<4?banner('warn','alert',T.min4):'')
    +(list.length===0?'<div class="state"><span class="big">'+ic('users')+'</span><b class="t-titleM">'+T.empty+'</b><span class="c2">'+T.emptyHint+'</span></div>':list.map((n,i)=>prow(i,n)).join(''))
    +(list.length<12?addRow:'<span class="t-caption c2">'+T.max12+'</span>')+'</div>',
  actions:btn('primary',T.cont,{dis:list.length<4}),...extra});
const voteScreen=(o)=>({theme:'private',bodyClass:'tight',
  body:hint+'<div><div class="t-titleM c2 iso one" style="overflow:hidden;text-overflow:ellipsis">'+o.voter+'</div><div class="t-titleL">'+(o.runoff?T.runoff:T.voteTitle)+'</div>'+(o.runoff?'<div class="t-bodyM c2">'+T.runoffHint+'</div>':'')+'</div>'
    +'<div class="col" data-m="list">'+o.options.map(n=>vopt(n,n===o.voter?'dis':n===o.sel?'sel':'')).join('')+'</div>'+(o.err?banner('err','alert',T.error):''),
  actions:(o.saving?loadingBtn('primary'):btn('primary',T.confirm,{dis:!o.sel}))+btn('secondary',T.back)});
const tallyScreen=(o)=>({theme:'public',
  body:appbar(T.tallyTitle,{close:1})+chip('vote',o.runoff?T.runoff:T.vote)+'<div>'+o.rows.map(r=>tally(r[0],r[1])).join('')+'</div>'+o.block,
  actions:btn('primary',o.cta)});
const resultScreen=(o)=>({theme:'public',
  body:'<div class="winner"><span class="bigstamp '+o.stamp+'">'+o.title+'</span>'+(o.why?'<span class="t-bodyL">'+o.why+'</span>':'')+'</div>'
    +'<div class="plaque"><span class="t-caption c2">'+T.wordLabel+'</span><span class="word one" data-fit="40">'+(o.word||WORD)+'</span><span class="chip">'+T.category+' '+CAT+'</span></div>'
    +(o.guess?'<div class="card" style="flex-direction:column;align-items:stretch;padding:16px;gap:4px"><span class="t-caption c2">'+T.guessOf+'</span><span class="t-titleM iso">'+o.guess+'</span><span class="okline" style="color:var('+(o.ok?'--ok':'--error-text')+')">'+ic(o.ok?'check':'x',1)+(o.ok?T.correct:T.wrong)+'</span></div>':'')
    +'<div class="col"><span class="t-titleM">'+T.players+'</span>'+o.players.map((n,i)=>rrow(i,n,i===o.imp)).join('')+'</div>'
    +'<div class="col"><span class="t-titleM">'+T.votes+'</span><span class="t-labelM">'+T.first+'</span><div>'+o.first.map(r=>tally(r[0],r[1])).join('')+'</div>'
    +(o.second?'<span class="t-labelM">'+T.runoff+'</span><div>'+o.second.map(r=>tally(r[0],r[1])).join('')+'</div>':'')+'</div>'
    +(o.allPinned?'':'<div class="col">'+btn('secondary',T.change)+btn('text',T.home)+'</div>'),
  actions:btn('accent',T.again,{icon:'rotate_ccw'})+(o.allPinned?btn('secondary',T.change)+btn('text',T.home):'')});
const editSheet=(mode,o={})=>sheet('<h3 class="h-title" style="font-size:22px">'+(mode==='add'?T.addPlayer:T.rename)+'</h3>'
  +field(T.nameLabel,o.value||(mode==='add'?T.nameHint:P6[1]),{ph:mode==='add'&&!o.value,focus:1,err:o.err,help:T.nameLimit,count:(o.count||(mode==='add'?0:5))+' / 16'})
  +btn('primary',mode==='add'?T.add:T.confirm,{dis:mode==='add'&&!o.value})
  +(mode==='edit'?'<div class="pair">'+btn('secondary',T.earlier)+btn('secondary',T.later)+'</div>'+btn('danger',T.del,{icon:'trash'}):''));

const SCREENS={
 pub01_home:()=>({theme:'public',body:'<div class="appbar"><span class="grow"></span>'+iconbtn('settings',false,'settings')+'</div><img class="hero" src="__LOGO__/logo_ticket_lockup.svg" alt=""><div class="col tc"><span class="t-displayM">'+T.tagline+'</span><span class="t-bodyM c2">'+T.facts+'</span></div>',actions:btn('primary',T.newGame)+btn('secondary',T.howTo)}),

/* ---------- render ---------- */
const root=document.getElementById('root');
if(!SID){
  root.className='index';
  root.innerHTML='<h1>Tesskra — screen compositions</h1><p>Design reference built from the tokens. Provisional Arabic, mock content. Open a screen at a size:</p><ul>'+Object.keys(SCREENS).map(k=>'<li>'+k+' — '+[[360,720,1],[320,568,1],[320,568,1.5]].map(v=>'<a href="?s='+k+'&w='+v[0]+'&h='+v[1]+'&ts='+v[2]+'">'+v[0]+'×'+v[1]+(v[2]>1?' @'+v[2]:'')+'</a>').join(' · ')+' · <a href="?s='+k+'&full=1">full length</a></li>').join('')+'</ul>';
}else{
  const s=SCREENS[SID]();
  const kbH=s.kb?KB:0;
  root.innerHTML='<div class="device '+s.theme+'" id="device" style="--m:'+M+'px;width:'+W+'px;'+(FULL?'min-height:'+H+'px':'height:'+H+'px')+'">'
    +'<div class="sb"></div><div class="body maxw '+(s.bodyClass||'')+'" id="body"'+(FULL?' style="overflow:visible;flex:none"':'')+'>'+s.body+'</div>'
    +(s.actions?'<div class="actions maxw" id="actions">'+s.actions+'</div>':'<div style="height:24px;flex:none"></div>')
    +(kbH?'<div class="kb" style="height:'+kbH+'px">keyboard (assumed '+kbH+' dp)</div>':'')+'<div class="nb"></div>'
    +(s.overlay?s.overlay.replace('class="overlay','style="bottom:'+(kbH+48)+'px;top:24px" class="overlay'):'')+'</div>';
  const dev=document.getElementById('device');
  const run=()=>{
    // text scale: multiply every computed font size (display styles are not clamped up to 1.5)
    if(TS!==1){const els=[...dev.querySelectorAll('*')].filter(e=>!e.closest('.kb'));const sizes=els.map(e=>parseFloat(getComputedStyle(e).fontSize));els.forEach((e,i)=>e.style.fontSize=(sizes[i]*TS)+'px');}
    // shrink-to-fit: one line down to an absolute floor (typography.json minFontSize)
    dev.querySelectorAll('[data-box]').forEach(e=>e.style.height=(parseFloat(e.dataset.box)*TS)+'px');
    const fits=[];
    dev.querySelectorAll('[data-fit]').forEach(e=>{const min=+e.dataset.fit;let f=parseFloat(getComputedStyle(e).fontSize);e.style.maxWidth='100%';e.style.overflow='hidden';while(e.scrollWidth>e.clientWidth&&f>min){f-=1;e.style.fontSize=f+'px';}fits.push({m:e.dataset.m||'',font:f,clipped:e.scrollWidth>e.clientWidth});});
    dev.querySelectorAll('[data-fitwrap]').forEach(e=>{const min=+e.dataset.fitwrap;let f=parseFloat(getComputedStyle(e).fontSize);e.style.whiteSpace='nowrap';e.style.maxWidth='100%';while(e.scrollWidth>e.clientWidth&&f>min){f-=1;e.style.fontSize=f+'px';}if(e.scrollWidth>e.clientWidth){e.style.whiteSpace='normal';e.style.textAlign='center';}fits.push({m:e.dataset.m||'',font:f,wrapped:getComputedStyle(e).whiteSpace==='normal'});});
    dev.querySelectorAll('[data-fit2]').forEach(e=>{const min=+e.dataset.fit2;let f=parseFloat(getComputedStyle(e).fontSize);e.style.whiteSpace='nowrap';e.style.maxWidth='100%';while(e.scrollWidth>e.clientWidth&&f>min){f-=1;e.style.fontSize=f+'px';}if(e.scrollWidth>e.clientWidth){e.style.whiteSpace='normal';}const lh=parseFloat(getComputedStyle(e).lineHeight);fits.push({m:e.dataset.m||'name',font:f,lines:Math.round(e.getBoundingClientRect().height/lh)});});
    // measurements
    const R=e=>{const r=e.getBoundingClientRect();return{x:Math.round(r.left),y:Math.round(r.top),w:Math.round(r.width),h:Math.round(r.height)}};
    const body=document.getElementById('body');
    const limit=dev.getBoundingClientRect().height-48-kbH;   // bottom of usable area
    const acts=[...dev.querySelectorAll('.btn')].map(b=>{const r=R(b);return{act:b.dataset.act,...r,visible:r.y>=24&&r.y+r.h<=limit+0.5&&(!b.closest('#body')||r.y+r.h<=body.getBoundingClientRect().bottom+0.5)}});
    const taps=[...dev.querySelectorAll('[data-tap]')].map(R).filter(r=>r.w<48||r.h<48);
    const hover=[...dev.querySelectorAll('.body *,.actions *,.sheet *,.dialog *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.left<-0.5||r.right>W+0.5)}).length;
    const trunc=[...dev.querySelectorAll('.name,.lbl1,.one')].filter(e=>e.scrollWidth>e.clientWidth+1).map(e=>e.textContent.slice(0,24));
    const named={};dev.querySelectorAll('[data-m]').forEach(e=>{const r=R(e);const range=document.createRange();range.selectNodeContents(e);named[e.dataset.m]={...r,textW:Math.round(range.getBoundingClientRect().width),font:Math.round(parseFloat(getComputedStyle(e).fontSize)*10)/10}});
    const fields=[...dev.querySelectorAll('[data-field]')].map(e=>{const r=R(e);return{...r,visible:r.y>=24&&r.y+r.h<=limit+0.5}});
    document.getElementById('metrics').textContent=JSON.stringify({id:SID,w:W,h:H,ts:TS,kb:kbH,margin:M,deviceH:Math.round(dev.getBoundingClientRect().height),bodyClient:body.clientHeight,bodyContent:body.scrollHeight,hidden:Math.max(0,body.scrollHeight-body.clientHeight),usableBottom:limit,acts,fields,smallTaps:taps,hOverflow:hover,truncated:trunc,fits,named});
  };
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(run,50));
}
